# Builds the Windows installer and the Mac app on real Windows / Mac machines,
# runs an offline smoke test on each, and attaches both to a GitHub Release.
#   Start it: push a tag like v1.0.0, or Actions tab -> "Build installers" -> Run workflow.
name: Build installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Assemble app (Python + packages + Ollama + models)
        run: python installer/assemble.py
      - name: Offline smoke test (network lock on)
        run: build\PolicyLookup\python\python.exe tests\smoke_test.py build\PolicyLookup\app
      - name: Icons
        run: build\PolicyLookup\python\python.exe installer\make_icons.py build\icons
      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $v = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME.TrimStart("v") } else { "1.0.0" }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" installer\windows\PolicyLookup.iss
      - uses: actions/upload-artifact@v4
        with: { name: PolicyLookup-Setup-Windows, path: build/installers/PolicyLookup-Setup-Windows.exe }
      - name: Attach to release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with: { files: build/installers/PolicyLookup-Setup-Windows.exe }

  mac:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Assemble app (Python + packages + Ollama + models)
        run: python installer/assemble.py
      - name: Offline smoke test (network lock on)
        run: build/PolicyLookup/python/bin/python3.12 tests/smoke_test.py build/PolicyLookup/app
      - name: Icons
        run: build/PolicyLookup/python/bin/python3.12 installer/make_icons.py build/icons
      - name: Build Mac app and .dmg
        run: |
          V=1.0.0; if [ "$GITHUB_REF_TYPE" = "tag" ]; then V="${GITHUB_REF_NAME#v}"; fi
          installer/mac/build_app.sh "$V"
      - uses: actions/upload-artifact@v4
        with: { name: PolicyLookup-Mac, path: build/installers/PolicyLookup-Mac.dmg }
      - name: Attach to release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with: { files: build/installers/PolicyLookup-Mac.dmg }
